[project]
name = "docdesk"
version = "0.1.0"
description = "A Switch agent that answers from your repo with citations and turns chat corrections into doc fixes"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "websockets>=13",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools]
packages = ["agent"]
